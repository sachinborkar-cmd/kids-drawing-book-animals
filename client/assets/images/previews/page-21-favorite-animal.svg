<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="600" height="848">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- Title & Subtitle -->
  <text x="297" y="85" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="#1f4e5f" text-anchor="middle">My Favorite Animal</text>
  <text x="297" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#4a7c8c" text-anchor="middle">Draw and color your own favorite animal in the frame below.</text>

  <!-- Big Drawing Box -->
