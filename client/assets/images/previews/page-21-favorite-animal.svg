  <line x1="220" y1="705" x2="525" y2="705" stroke="#888888" stroke-width="1.5"/>

  <!-- Footer -->
  <text x="34" y="818" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#aaaaaa">Kids Drawing Book — Animals</text>
